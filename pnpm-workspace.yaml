packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - better-sqlite3
  - prisma

# Pin vetted compatible security fixes; keep separate major API lines intact.
overrides:
  'hono@>=4.0.0 <4.13.11': 4.13.11
  'seroval@>=1.0.0 <1.6.11': 1.6.11
  'proxy-addr@2.0.7': 2.0.8
  'effect@3.18.4': 3.20.0
  'picomatch@4.0.3': 4.0.4
  'picomatch@2.3.1': 2.3.2
  'lodash@4.17.21': 4.18.1
  'undici@7.24.0': 7.30.1
  'js-yaml@4.1.1': 4.3.2
  '@modelcontextprotocol/sdk@1.27.1': 1.32.0
  'defu@6.1.4': 6.1.5
  # Prefer the vetted October release over the version published on remediation day.
  'jose@>=6.2.3 <6.2.16': 6.2.13
  'jose@6.2.16': 6.2.13
  'brace-expansion@5.0.4': 5.0.12
  'brace-expansion@1.1.12': 1.1.21
  'fast-uri@3.1.0': 3.1.9
  'postcss@>=8.0.0 <8.5.23': 8.5.23
  'ip-address@10.1.0': 10.7.4
  'nanoid@>=3.0.0 <3.3.20': 3.3.20
  'browserslist@>=4.28.1 <4.30.0': 4.28.7
  'mysql2@3.15.3': 3.23.1
  'flatted@3.4.1': 3.4.2
  'source-map-js@1.2.1': 1.2.2
  'body-parser@2.2.2': 2.4.0
  'path-to-regexp@8.3.0': 8.4.0
  # Upstream BiDi now supports Zod 4; do not force Zod 4 into the old BiDi caller.
  'puppeteer@25.2.1': 25.14.0
  # Both upstream consumers explicitly support Zod 4.
  '@modelcontextprotocol/sdk>zod': 4.6.6
  'zod-to-json-schema>zod': 4.6.6
  # Upgrade Prisma's owning packages together; do not force deepmerge 8 into config 7.5.
  'prisma@7.5.0': 7.10.1
  '@prisma/client@7.5.0': 7.10.1
