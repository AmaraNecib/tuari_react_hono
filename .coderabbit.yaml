# CodeRabbit Configuration
# See https://coderabbit.ai/docs/config for full documentation

reviews:
  review_status: false
  max_issues_severity: warning
  path_filters:
    - "!**/node_modules/**"
    - "!**/target/**"
    - "!**/.git/**"
    - "!**/dist/**"
  path_instructions:
    - path: "apps/desktop/src-tauri/src/**/*.rs"
      instructions: |
        These are Rust Core (Trust Authority) modules.
        - Must not import `tauri::` or any Tauri types.
        - Must return `Result<T, RustCoreError>` for fallible operations.
        - Must be testable with `cargo test` without Tauri.
    - path: "packages/contracts/src/**/*.ts"
      instructions: |
        These are shared Zod schemas.
        - Must match the corresponding Rust structs field-by-field.
        - Must be exported from `packages/contracts/src/index.ts`.
  auto_review:
    enabled: false          # No auto-reviews on PR creation or push
  request_changes_workflow: false  # Disable request-changes workflow
  auto_merge:
    enabled: false
  # Manual triggers only:
  #   - Comment @coderabbitai review on a PR to trigger a full review
  #   - Comment @coderabbitai review --summary-only for a summary
  #   - Comment @coderabbitai full_review for a comprehensive review

chat:
  auto_reply: true
