<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1440"/>
<title>TauriOS — Construction Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="page-dashboard.jsx"></script>
<script type="text/babel" src="page-projects.jsx"></script>
<script type="text/babel" src="page-rest.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "accent": "#1a1714",
  "palette": [
    "#b4502a",
    "#1a1714",
    "#f6f3ee"
  ],
  "fontDisplay": "mono",
  "fontBody": "inter-tight",
  "density": "regular",
  "sidebarWidth": 220,
  "fontSize": 13.5,
  "lang": "en",
  "sidebarCollapsed": false
}/*EDITMODE-END*/;

const FONT_DISPLAY = {
  "instrument": '"Instrument Serif", Georgia, serif',
  "inter-tight": '"Inter Tight", system-ui, sans-serif',
  "mono": '"JetBrains Mono", ui-monospace, monospace',
};
const FONT_BODY = {
  "inter-tight": '"Inter Tight", "Inter", system-ui, sans-serif',
  "inter": '"Inter", system-ui, sans-serif',
  "system": 'system-ui, -apple-system, sans-serif',
};

function applyAccent(hex, dark) {
  // Build complementary tokens from the chosen accent
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  const lighter = `rgb(${Math.min(255,r+30)},${Math.min(255,g+30)},${Math.min(255,b+30)})`;
  const soft = dark
    ? `rgba(${r},${g},${b},0.16)`
    : `rgba(${r},${g},${b},0.12)`;
  document.documentElement.style.setProperty("--accent", hex);
  document.documentElement.style.setProperty("--accent-2", lighter);
  document.documentElement.style.setProperty("--accent-soft", soft);
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [page, setPage] = React.useState("dashboard");
  const [projectId, setProjectId] = React.useState(null);

  React.useEffect(() => {
    document.documentElement.dataset.theme = t.dark ? "dark" : "light";
    document.documentElement.dataset.density = t.density;
    document.documentElement.lang = t.lang || "en";
    document.documentElement.dir = (t.lang === "ar") ? "rtl" : "ltr";
    document.documentElement.style.setProperty("--font-display", FONT_DISPLAY[t.fontDisplay] || FONT_DISPLAY.instrument);
    document.documentElement.style.setProperty("--font-body", FONT_BODY[t.fontBody] || FONT_BODY["inter-tight"]);
    document.documentElement.style.setProperty("--sidebar-w", t.sidebarWidth + "px");
    document.documentElement.style.setProperty("--fs-base", t.fontSize + "px");
    applyAccent(t.accent, t.dark);
  }, [t.dark, t.density, t.fontDisplay, t.fontBody, t.sidebarWidth, t.fontSize, t.accent, t.lang]);

  const lang = t.lang || "en";
  const tr = React.useMemo(() => {
    const fn = (key) => (window.T[lang] && window.T[lang][key]) || window.T.en[key] || key;
    fn._lang = lang;
    return fn;
  }, [lang]);

  const orgName = tr("org");
  const crumbsByPage = {
    dashboard: [orgName, tr("nav_dashboard")],
    projects:  [orgName, tr("nav_projects")],
    project:   [orgName, tr("nav_projects"), (window.MOCK?.PROJECTS.find(p=>p.id===projectId)?.name || "Project")],
    warehouse: [orgName, tr("nav_warehouse")],
    expenses:  [orgName, tr("nav_expenses")],
    invoices:  [orgName, tr("nav_invoices")],
    partners:  [orgName, tr("nav_partners")],
    employees: [orgName, tr("nav_employees")],
    analytics: [orgName, tr("nav_analytics")],
    reports:   [orgName, tr("nav_reports")],
    settings:  [orgName, tr("nav_settings")],
  };

  const renderPage = () => {
    switch(page) {
      case "dashboard": return <Dashboard t={tr}/>;
      case "projects":  return <ProjectsPage onOpen={(id) => { setProjectId(id); setPage("project"); }}/>;
      case "project":   return <ProjectDetail id={projectId} onBack={() => setPage("projects")}/>;
      case "warehouse": return <WarehousePage/>;
      case "expenses":  return <ExpensesPage/>;
      case "invoices":  return <InvoicesPage/>;
      case "partners":  return <PartnersPage/>;
      case "employees": return <EmployeesPage/>;
      case "analytics": return <AnalyticsPage/>;
      default: return (
        <>
          <PageHead eyebrow="Coming soon" title={`<b>${page[0].toUpperCase()+page.slice(1)}</b>`}
            sub="This area of the app is part of the redesign roadmap."/>
          <div className="slot" style={{height: 320}}>SCREEN PLACEHOLDER · {page.toUpperCase()}</div>
        </>
      );
    }
  };

  return (
    <div className="shell" data-screen-label={`TauriOS / ${page}`} data-collapsed={t.sidebarCollapsed ? "true" : "false"}>
      <Sidebar t={tr} active={page === "project" ? "projects" : page} onNav={(k)=>{ setProjectId(null); setPage(k); }}/>
      <main className="main">
        <Topbar t={tr} crumbs={crumbsByPage[page] || [orgName]}
          dark={t.dark}
          onToggleTheme={() => setTweak("dark", !t.dark)}
          onToggleSidebar={() => setTweak("sidebarCollapsed", !t.sidebarCollapsed)}/>
        <div className="content">{renderPage()}</div>
      </main>

      <TweaksPanel>
        <TweakSection label="Language / اللغة"/>
        <TweakRadio label="Language" value={t.lang || "en"}
          options={[{value:"en",label:"English"},{value:"ar",label:"العربية"}]}
          onChange={(v)=>setTweak("lang", v)}/>

        <TweakSection label="Theme"/>
        <TweakToggle label="Dark mode" value={t.dark} onChange={(v)=>setTweak("dark", v)}/>
        <TweakColor label="Accent" value={t.accent}
          options={["#b4502a","#2a6fdb","#1f8a5b","#7a5ae0","#c0392b","#1a1714"]}
          onChange={(v)=>setTweak("accent", v)}/>

        <TweakSection label="Typography"/>
        <TweakRadio label="Display font" value={t.fontDisplay}
          options={[{value:"instrument",label:"Serif"},{value:"inter-tight",label:"Sans"},{value:"mono",label:"Mono"}]}
          onChange={(v)=>setTweak("fontDisplay", v)}/>
        <TweakSelect label="Body font" value={t.fontBody}
          options={[{value:"inter-tight",label:"Inter Tight"},{value:"inter",label:"Inter"},{value:"system",label:"System"}]}
          onChange={(v)=>setTweak("fontBody", v)}/>
        <TweakSlider label="Base size" value={t.fontSize} min={11} max={16} step={0.5} unit="px"
          onChange={(v)=>setTweak("fontSize", v)}/>

        <TweakSection label="Layout"/>
        <TweakRadio label="Density" value={t.density}
          options={[{value:"compact",label:"Compact"},{value:"regular",label:"Regular"},{value:"comfy",label:"Comfy"}]}
          onChange={(v)=>setTweak("density", v)}/>
        <TweakSlider label="Sidebar width" value={t.sidebarWidth} min={200} max={300} step={4} unit="px"
          onChange={(v)=>setTweak("sidebarWidth", v)}/>

        <TweakSection label="Quick navigate"/>
        <TweakSelect label="Open page" value={page}
          options={[
            {value:"dashboard",label:"Dashboard"},
            {value:"projects",label:"Projects"},
            {value:"warehouse",label:"Warehouse"},
            {value:"expenses",label:"Expenses"},
            {value:"invoices",label:"Invoices"},
            {value:"partners",label:"Partners"},
            {value:"employees",label:"Employees"},
            {value:"analytics",label:"Analytics"},
          ]}
          onChange={(v)=>{ setProjectId(null); setPage(v); }}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
