<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuari — جارٍ التحميل</title>
    <!--
      Static splashscreen shown while the API sidecar boots and React mounts
      behind the hidden main window. Deliberately dependency-free and
      script-free: the app CSP (script-src 'self') forbids inline scripts,
      so this page must stay pure HTML + inline CSS.
    -->
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --ink: #171717;
        --ink-2: #404040;
        --ink-3: #595959;
        --brand: #b4502a;
        --brand-2: #d4754a;
        --line: #e5e5e5;
        --font-display: "Instrument Serif", "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --font-arabic: "IBM Plex Sans Arabic", "Noto Sans Arabic Variable", "Segoe UI", Tahoma, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-arabic);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        user-select: none;
      }

      .brand-mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        box-shadow: 0 8px 20px rgba(180, 80, 42, 0.28);
      }

      .brand-mark-letter {
        font-family: var(--font-display);
        font-size: 30px;
        line-height: 1;
        color: #ffffff;
        font-weight: 400;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: 0.02em;
        color: var(--ink);
      }

      .brand-tagline {
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-3);
      }

      .spinner {
        width: 34px;
        height: 34px;
        margin-top: 6px;
        border: 3px solid var(--line);
        border-top-color: var(--brand);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Respect users who prefer reduced motion: show a static dot instead. */
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-top-color: var(--brand-2);
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="brand-mark" aria-hidden="true">
        <span class="brand-mark-letter">T</span>
      </div>
      <div>
        <div class="brand-name">Tuari</div>
        <div class="brand-tagline">نظام إدارة</div>
      </div>
      <div class="spinner" role="status" aria-label="جارٍ التحميل"></div>
    </div>
  </body>
</html>
