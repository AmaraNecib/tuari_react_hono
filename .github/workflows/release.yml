# Release workflow
# Triggered by a tag push matching v*.*.* on main
# Produces and uploads release artifacts to GitHub Releases

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    environment: stable
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Setup ──────────────────────────────────────────────

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      # ── Dependencies ───────────────────────────────────────

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @tuari/contracts build

      # ── Architecture guardrails ──────────────────────────

      - name: Verify Rust Core boundaries (no bare tauri imports)
        shell: pwsh
        run: |
          Write-Host "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          $coreModules = @(
            "apps/desktop/src-tauri/src/crypto.rs",
            "apps/desktop/src-tauri/src/error.rs",
            "apps/desktop/src-tauri/src/clock.rs",
            "apps/desktop/src-tauri/src/license.rs",
            "apps/desktop/src-tauri/src/recovery.rs"
          )
          $hasTauri = $false
          foreach ($mod in $coreModules) {
            if (Test-Path $mod) {
              $lines = Select-String -Path $mod -Pattern 'use tauri|tauri::' | ForEach-Object { "$($_.LineNumber): $($_.Line.Trim())" }
              if ($lines) {
                Write-Host "ERROR: forbidden tauri import in $mod"
                $lines | ForEach-Object { Write-Host $_ }
                $hasTauri = $true
              }
            }
          }
          if ($hasTauri) {
            Write-Host "FAILED: Rust Core modules must not import tauri::"
            exit 1
          }
          Write-Host "PASSED: No forbidden imports found"

      # ── Build ──────────────────────────────────────────────

      - name: Build desktop app (web + sidecar + Tauri)
        run: pnpm --filter @tuari/desktop build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Create portable package
        run: pnpm --filter @tuari/desktop portable:only

      # ── Sign update package ──────────────────────────────

      - name: Compute checksum and create update manifest
        id: manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_KEY_ID: ${{ secrets.UPDATE_KEY_ID }}
        run: |
          # Extract version from tag (strip leading 'v')
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Release version: $version"

          # Paths to artifacts
          $portableZip = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/portable" -Filter "*.zip" | Select-Object -First 1
          if (-not $portableZip) {
            throw "No portable zip found!"
          }
          $portableZipPath = $portableZip.FullName
          Write-Host "Portable zip: $portableZipPath"

          # Compute SHA-256 of the zip
          $hash = (Get-FileHash -Path $portableZipPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "Portable zip SHA-256: $hash"

          $size = (Get-Item $portableZipPath).Length
          Write-Host "Portable zip size: $size"

          # Determine signing key: use GitHub Secret if set, otherwise fall back to dev key
          $privateKey = $env:UPDATE_SIGNING_KEY
          if (-not $privateKey) {
            $privateKeyPath = Resolve-Path "scripts/dev-update-keys/dev-update-private-key.pem"
            Write-Host "Using dev signing key from $privateKeyPath"
            $privateKey = Get-Content $privateKeyPath -Raw
          } else {
            Write-Host "Using signing key from GitHub Secret"
          }
          $keyFile = Join-Path $env:RUNNER_TEMP "signing-key.pem"
          $privateKey | Out-File -FilePath $keyFile -Encoding ascii -NoNewline

          # Create manifest.json
          $manifest = @{
            version = $version
            platform = "windows-x86_64"
            minSupportedVersion = "0.1.0"
            checksum = $hash
            files = @(
              @{
                path = "Tuari-portable.zip"
                hash = $hash
                size = $size
              }
            )
          } | ConvertTo-Json -Compress

          $manifestPath = Join-Path $env:RUNNER_TEMP "manifest.json"
          $manifest | Out-File -FilePath $manifestPath -Encoding utf8
          Write-Host "Manifest written to $manifestPath"

          # Determine key ID: use secret if set, otherwise dev key
          $keyId = $env:UPDATE_KEY_ID
          if (-not $keyId) {
            $keyId = "dev-key-v1"
            Write-Host "Using key ID: $keyId (dev)"
          } else {
            Write-Host "Using key ID: $keyId (from secret)"
          }

          # Sign the manifest
          $signedOutput = Join-Path $env:RUNNER_TEMP "tuari-$version-stable.update"
          & node scripts/sign-update.mjs `
            --private-key "$keyFile" `
            --manifest "$manifestPath" `
            --output "$signedOutput" `
            --key-id "$keyId"
          Write-Host "Signed update package: $signedOutput"

          # Read the signed content to extract the signature
          $signedContent = Get-Content $signedOutput -Raw
          $lastDot = $signedContent.LastIndexOf('.')
          $signaturePart = $signedContent.Substring($lastDot + 1)

          # Copy the signed update to the artifacts directory
          $artifactsDir = Join-Path $env:RUNNER_TEMP "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null

          Copy-Item -Path $signedOutput -Destination $artifactsDir

          # Also stage the portable zip and installer for the smoke test
          $portableZip = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/portable" -Filter "*.zip" | Select-Object -First 1
          if ($portableZip) {
            $portableName = "tuari-$version-stable-portable.zip"
            Copy-Item -Path $portableZip.FullName -Destination (Join-Path $artifactsDir $portableName)
            Write-Host "Staged portable zip: $portableName"
          }
          $installer = Get-ChildItem -Path "apps/desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if ($installer) {
            $installerName = "tuari-$version-stable-setup.exe"
            Copy-Item -Path $installer.FullName -Destination (Join-Path $artifactsDir $installerName)
            Write-Host "Staged installer: $installerName"
          }

          # Create updates.json with the actual signature
          $updates = @{
            version = $version
            channel = "stable"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/tuari-$version-stable.update"
                signature = $signaturePart
              }
            }
          } | ConvertTo-Json -Compress

          $updatesJsonPath = Join-Path $artifactsDir "updates.json"
          $updates | Out-File -FilePath $updatesJsonPath -Encoding utf8

          Write-Host "updates.json written to $updatesJsonPath"

          # Set outputs
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "artifacts_dir=$artifactsDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "signature=$signaturePart" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ── Smoke test ─────────────────────────────────────────

      - name: Smoke test release artifacts
        shell: pwsh
        run: |
          # Always write the public key to a temp file so we can pass it as a separate argument
          $pubKeyContent = "${{ secrets.UPDATE_PUBLIC_KEY }}"
          $pubKeyFile = Join-Path $env:RUNNER_TEMP "update-public-key.pem"
          if (-not $pubKeyContent) {
            # Fall back to dev public key
            Get-Content "scripts/dev-update-keys/dev-update-public-key.pem" | Out-File -FilePath $pubKeyFile -Encoding ascii -NoNewline
            Write-Host "Using dev public key for smoke test"
          } else {
            $pubKeyContent | Out-File -FilePath $pubKeyFile -Encoding ascii -NoNewline
            Write-Host "Using production public key from GitHub Secret"
          }
          node scripts/verify-release-assets.mjs `
            --artifacts "${{ steps.manifest.outputs.artifacts_dir }}" `
            --public-key "$pubKeyFile" `
            --version "${{ steps.manifest.outputs.version }}" `
            --channel stable

      # ── List staged artifacts ────────────────────────────

      - name: List staged artifacts
        shell: pwsh
        run: |
          Write-Host "Artifacts ready for upload from: ${{ steps.manifest.outputs.artifacts_dir }}"
          Get-ChildItem -Path "${{ steps.manifest.outputs.artifacts_dir }}" | ForEach-Object { Write-Host "  - $($_.Name)" }

      # ── Upload to GitHub Release ─────────────────────────

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tuari ${{ steps.manifest.outputs.version }}
          body_path: ""  # auto-generated release notes
          generate_release_notes: true
          files: |
            ${{ steps.manifest.outputs.artifacts_dir }}/*
          fail_on_unmatched_files: true
