name: Auto-close issues on merge to develop

# GitHub only auto-closes issues when a PR merges into the DEFAULT branch
# (main). This repo merges all work into `develop`, so "Closes #N" never
# auto-closes anything. This workflow closes the linked issues manually on
# merge. The close logic lives in scripts/ci/close-linked-issues.sh and is
# unit-tested by scripts/ci/test-close-linked-issues.sh.
#
# IMPORTANT — multi-PR issues: an issue may need SEVERAL PRs to be fully
# delivered (e.g. #177 needed #179 + #189 + #258). A keyword parser cannot
# tell "fully delivered" from "partially delivered". So this workflow is
# deliberately CONSERVATIVE:
#
#   1. It only honors "Closes #N" in the PR BODY, never the title.
#   2. It skips parent/tracker issues that have open sub-issues.
#   3. It skips an issue whose body marks REMAINING work in a still-open issue
#      ("remaining"/"todo" only — NOT lineage markers like "Part of #N" /
#      "follow-up from #N" / "deferred from #N", which just say where the
#      issue came from and never mean it has unfinished scope).
#   4. It skips when the PR body marks THE NUMBER BEING CLOSED itself as
#      partial/deferred (self-reference). "Closes #201 / Part of #200" closes
#      #201 fully — #200's open status is irrelevant to #201.
#   5. Every optional API lookup fails OPEN — a failed lookup never kills the
#      job — and every closed/skipped decision lands in the run summary.
#
# Convention (enforced by review, not by this workflow):
#   - A PR that delivers PART of an issue must say "Part of #N" — never "Closes #N".
#   - Only the PR that finishes the issue says "Closes #N" / "Fixes #N".
# See docs/lessons/gh-pr-merge-squash-issue-close.md and .agents/wisdom/process.md.

on:
  pull_request:
    types: [closed]
  # Validation harness (issue #54): exercise the exact production close path
  # against any merged PR WITHOUT opening throwaway PRs or real merges.
  # dry_run defaults to true — nothing is closed unless explicitly opted in.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number whose body should be scanned'
        required: true
        type: string
      dry_run:
        description: 'Log actions without closing anything'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  issues: write
  pull-requests: read  # the dispatch harness reads a PR body via GET /issues/N (issue #54)

jobs:
  close-linked-issues:
    # Real trigger: only on merges INTO develop — native auto-close already
    # covers the default branch, so running there would duplicate it.
    # Dispatch runs are allowed as the validation harness.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    # MUST stay self-hosted (issue #54): this repo's GitHub-hosted runners are
    # unavailable — every ubuntu-latest/windows-latest job fails at startup
    # with zero steps in ~3s, while all self-hosted jobs succeed. This was the
    # exact cause of the 3/3 job failures.
    runs-on: self-hosted
    steps:
      - name: Check out repository (so gh resolves owner/repo context)
        # Pinned to commit SHA — a mutable tag (v4) could be compromised upstream
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Close issues referenced by the merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          # PR_BODY comes from context on the real trigger (cheap, no API
          # call); the dispatch harness leaves it empty so the script fetches
          # the body AND enforces the merged-into-develop qualification.
          PR_BODY: ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.body || '' }}
        shell: bash
        run: bash scripts/ci/close-linked-issues.sh
