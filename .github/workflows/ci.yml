name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Auto-cancel older CI runs on the same branch — only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  test-rust:
    name: "Test Rust Core (no tauri:: imports)"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "Verify tool versions"
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Rust: $(rustc --version)"

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          HAS_TAURI=false
          while IFS= read -r mod; do
            LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
            if [ -n "$LINES" ]; then
              echo "ERROR: forbidden tauri import in $mod"
              echo "$LINES"
              HAS_TAURI=true
            fi
          done < <(find apps/desktop/src-tauri/src -name '*.rs' -not -path '*/commands/*' -not -name 'lib.rs' -not -name 'main.rs')
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test-api:
    name: Test API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm --filter @tuari/api test:coverage

  test-web:
    name: Test Web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm test:web

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    needs: [lint, typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"
