name: CI

on:
  pull_request:
  workflow_dispatch:

# Auto-cancel older CI runs on the same PR — only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  # ── Path-gated jobs ─────────────────────────────────────────────
  # Each job ALWAYS runs (so its required status check always reports)
  # but its expensive steps are skipped when no relevant file changed.
  # A skipped job would produce NO check run → required status checks
  # would never resolve → PRs could not merge. That is why the gate is
  # on the STEP, not the job.

  test-rust:
    name: "Test Rust Core (no tauri:: imports)"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect Rust changes
        id: rust-changed
        run: echo "changed=${{ hashFiles('apps/desktop/src-tauri/**') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies (Tauri)
        if: steps.rust-changed.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        if: steps.rust-changed.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: steps.rust-changed.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: "Verify tool versions"
        if: steps.rust-changed.outputs.changed == 'true'
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Rust: $(rustc --version)"

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        if: steps.rust-changed.outputs.changed == 'true'
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          HAS_TAURI=false
          while IFS= read -r mod; do
            LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
            if [ -n "$LINES" ]; then
              echo "ERROR: forbidden tauri import in $mod"
              echo "$LINES"
              HAS_TAURI=true
            fi
          done < <(find apps/desktop/src-tauri/src -name '*.rs' -not -path '*/commands/*' -not -name 'lib.rs' -not -name 'main.rs')
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        if: steps.rust-changed.outputs.changed == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust skipped (no src-tauri changes)
        if: steps.rust-changed.outputs.changed != 'true'
        run: echo "No Rust changes — skipping cargo test (required check satisfied)"

  test-api:
    name: Test API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect API changes
        id: api-changed
        run: echo "changed=${{ hashFiles('apps/api/**', 'packages/contracts/**', 'infrastructure/**') != '' }}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - name: Test API
        if: steps.api-changed.outputs.changed == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm --filter @tuari/api test:coverage

      - name: API skipped (no api/contracts changes)
        if: steps.api-changed.outputs.changed != 'true'
        run: echo "No API changes — skipping tests (required check satisfied)"

  test-web:
    name: Test Web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect Web changes
        id: web-changed
        run: echo "changed=${{ hashFiles('apps/web/**', 'packages/contracts/**') != '' }}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - name: Test Web
        if: steps.web-changed.outputs.changed == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm test:web

      - name: Web skipped (no web/contracts changes)
        if: steps.web-changed.outputs.changed != 'true'
        run: echo "No Web changes — skipping tests (required check satisfied)"

  test-e2e:
    name: Test E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect E2E changes
        id: e2e-changed
        run: echo "changed=${{ hashFiles('apps/api/**', 'apps/web/**', 'packages/contracts/**', 'tests/e2e/**') != '' }}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - name: Test E2E
        if: steps.e2e-changed.outputs.changed == 'true'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: E2E skipped (no api/web/contracts/e2e changes)
        if: steps.e2e-changed.outputs.changed != 'true'
        run: echo "No E2E-relevant changes — skipping (required check satisfied)"

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api, test-web, test-e2e]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"
