name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  typecheck:
    name: Type Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  test-rust:
    name: "Test Rust Core (no tauri:: imports)"
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          CORE_MODULES="apps/desktop/src-tauri/src/crypto.rs apps/desktop/src-tauri/src/error.rs apps/desktop/src-tauri/src/clock.rs apps/desktop/src-tauri/src/license.rs apps/desktop/src-tauri/src/recovery.rs apps/desktop/src-tauri/src/update.rs apps/desktop/src-tauri/src/trust/rotation.rs apps/desktop/src-tauri/src/trust/trust_store.rs apps/desktop/src-tauri/src/trust/root_ca.rs"
          HAS_TAURI=false
          for mod in $CORE_MODULES; do
            if [ -f "$mod" ]; then
              LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
              if [ -n "$LINES" ]; then
                echo "ERROR: forbidden tauri import in $mod"
                echo "$LINES"
                HAS_TAURI=true
              fi
            fi
          done
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test-api:
    name: Test API
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm --filter @tuari/api test:coverage

  test-web:
    name: Test Web
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm test:web

  build:
    name: Build
    runs-on: self-hosted
    needs: [lint, typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"
