name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop]
  workflow_dispatch:

# Auto-cancel older CI runs on the same PR — only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      # Root-level gates turbo never runs: turbo has no root lint task, so the
      # prose gate and the issue-closing harness would silently pass CI.
      - run: pnpm check:unslop
      - run: node --test tests/ci-final.test.mjs tests/workflow-policy.test.mjs
      - run: pnpm check:web-hygiene
      - run: pnpm check:i18n-keys
      - run: pnpm check:repo-hygiene
      - run: pnpm check:dependency-security
      - name: Verify copied encrypted runtime
        run: node --test tests/sidecar-encryption.test.mjs
      - run: pnpm check:workflow-assets
      - run: pnpm check:update-metadata
      - run: pnpm test:prose
      - run: pnpm test:ci-scripts
      - run: pnpm check:e2e-selection
      - run: pnpm check:license-signer

  typecheck:
    name: Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  detect:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      rust: ${{ steps.scope.outputs.rust }}
      e2e_mode: ${{ steps.scope.outputs.e2e_mode }}
      e2e_specs: ${{ steps.scope.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute scope from event commits
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e:full') }}
        shell: bash
        run: |
          set -euo pipefail
          # Unknown history is a full run. --no-renames keeps both move sides.
          if [ "$CI_EVENT" = pull_request ] &&
             git merge-base "$CI_BASE" "$CI_HEAD" > scope-base.txt &&
             git diff --no-renames --name-only "$(cat scope-base.txt)" "$CI_HEAD" > changed.txt; then
            :
          else
            printf '*\n' > changed.txt
          fi
          node scripts/ci/ci-scope.mjs changed.txt > scope.txt
          cat scope.txt >> "$GITHUB_OUTPUT"
          { echo '### CI scope'; cat scope.txt; } >> "$GITHUB_STEP_SUMMARY"

  test-rust:
    if: ${{ needs.detect.outputs.rust == 'true' }}
    name: "Test Rust Core (no tauri:: imports)"
    runs-on: ubuntu-24.04
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri system deps
        if: needs.detect.outputs.rust == 'true'
        run: |
          if pkg-config --exists webkit2gtk-4.1; then
            echo "webkit2gtk-4.1 already present"
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          fi

      - name: Install Rust toolchain
        if: needs.detect.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: needs.detect.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Install Node.js (signer interop test)
        # tests/license_signer_interop.rs shells out to
        # scripts/generate-license.mjs, so the Rust job needs Node in PATH.
        if: needs.detect.outputs.rust == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        if: needs.detect.outputs.rust == 'true'

      - name: "Verify tool versions"
        if: needs.detect.outputs.rust == 'true'
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Rust: $(rustc --version)"

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        if: needs.detect.outputs.rust == 'true'
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          HAS_TAURI=false
          while IFS= read -r mod; do
            LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
            if [ -n "$LINES" ]; then
              echo "ERROR: forbidden tauri import in $mod"
              echo "$LINES"
              HAS_TAURI=true
            fi
          done < <(find apps/desktop/src-tauri/src -name '*.rs' -not -path '*/commands/*' -not -name 'lib.rs' -not -name 'main.rs')
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        # The license/trust core gates what a customer can run, so this step
        # runs the whole crate: lib unit tests, the integration suites
        # (including the Node-signer→Rust-verifier interop test), and doctests.
        if: needs.detect.outputs.rust == 'true'
        run: |
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --lib -- -D warnings

      - name: Rust skipped (no src-tauri changes)
        if: needs.detect.outputs.rust != 'true'
        run: echo "No Rust changes — skipping cargo test (required check satisfied)"

  test-api:
    if: ${{ needs.detect.outputs.api == 'true' }}
    name: Test API
    runs-on: ubuntu-24.04
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test API
        if: needs.detect.outputs.api == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm --filter @tuari/contracts test
          pnpm --filter @tuari/api test:coverage

      - name: API skipped (no api/contracts changes)
        if: needs.detect.outputs.api != 'true'
        run: echo "No API changes — skipping tests (required check satisfied)"

  test-web:
    if: ${{ needs.detect.outputs.web == 'true' }}
    name: Test Web
    runs-on: ubuntu-24.04
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test Web
        if: needs.detect.outputs.web == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm test:web

      - name: Web skipped (no web/contracts changes)
        if: needs.detect.outputs.web != 'true'
        run: echo "No Web changes — skipping tests (required check satisfied)"

  test-e2e:
    if: ${{ needs.detect.outputs.e2e_mode != 'skip' }}
    name: Test E2E
    if: >-
      needs.detect.outputs.e2e_mode != 'skip' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Playwright 1.58.2 rejects the current ubuntu-latest image (26.04).
    runs-on: ubuntu-24.04
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The e2e scope selector diffs the PR head against the base branch,
          # which needs the merge base — a shallow checkout cannot compute it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright browser cache (issue #333): Chromium (~120MB) was
      # re-downloaded on every E2E run (~40s). Key on the exact Playwright
      # version so an upgrade busts the cache automatically. On a hit the
      # `playwright install chromium` step below skips the
      # download; on a miss it installs and the post-step saves the cache.
      - name: Resolve Playwright version (cache key)
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # Pinned to a full commit SHA (v4 tag = 0057852bfaa89a56745cba8c7296529d2fc39830)
        # — mutable tags can be retargeted upstream and poison the browser
        # cache consumed by later test steps (repo security precedent: checkout
        # is SHA-pinned in auto-close-issues.yml).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Test E2E
        if: needs.detect.outputs.e2e_mode != 'skip'
        env:
          # Passed through the environment, not interpolated into the script:
          # map-derived, but never splice shipped data into shell source.
          E2E_SPECS: ${{ needs.detect.outputs.e2e_specs }}
        run: |
          pnpm exec playwright install --with-deps chromium
          # shellcheck disable=SC2086  # E2E_SPECS is an intentional space-separated list
          pnpm test:e2e $E2E_SPECS

      - name: Upload Playwright HTML report
        if: needs.detect.outputs.e2e_mode != 'skip' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (immutable SHA, matching the cache action pinning practice)
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: E2E skipped (no browser-reachable path changed)
        if: needs.detect.outputs.e2e_mode == 'skip'
        run: echo "No browser-reachable changes — scoped e2e skipped (required check satisfied)"

      - name: E2E skipped (no api/web/contracts/e2e changes)
        if: needs.detect.outputs.e2e_mode == 'skip'
        run: echo "No E2E-relevant changes — skipping (required check satisfied)"

  build:
    name: Build
    runs-on: ubuntu-24.04
    # Build overlaps applicable tests. CI acceptance requires both outcomes;
    # effective branch protection is an owner rollout, not a claim in this file.
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --audit-level high

  acceptance:
    name: CI acceptance
    needs: [detect, lint, typecheck, test-rust, test-api, test-web, test-e2e, build, audit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require successful applicable checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-acceptance.mjs
