name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @tuari/contracts build

      - name: Type check
        run: pnpm turbo typecheck --filter='!@tuari/desktop'

      - name: Lint
        run: pnpm turbo lint

      - name: Verify Rust Core module boundaries (no tauri:: imports)
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          CORE_MODULES="apps/desktop/src-tauri/src/crypto.rs apps/desktop/src-tauri/src/error.rs apps/desktop/src-tauri/src/clock.rs apps/desktop/src-tauri/src/license.rs apps/desktop/src-tauri/src/recovery.rs"
          HAS_TAURI=false
          for mod in $CORE_MODULES; do
            if [ -f "$mod" ]; then
              LINES=$(grep -n "tauri::\|use tauri" "$mod" | grep -v "^[0-9]*://" || true)
              if [ -n "$LINES" ]; then
                echo "ERROR: Found tauri:: import in $mod"
                echo "$LINES"
                HAS_TAURI=true
              fi
            fi
          done
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test API
        run: pnpm --filter @tuari/api test:coverage

      - name: Test Web
        run: pnpm test:web

      - name: Build
        run: pnpm turbo build --filter='!@tuari/desktop'
