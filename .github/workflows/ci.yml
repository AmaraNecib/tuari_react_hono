name: CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

# Auto-cancel older CI runs on the same PR — only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  test-rust:
    name: "Test Rust Core (no tauri:: imports)"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: "Verify tool versions"
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Rust: $(rustc --version)"

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          HAS_TAURI=false
          while IFS= read -r mod; do
            LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
            if [ -n "$LINES" ]; then
              echo "ERROR: forbidden tauri import in $mod"
              echo "$LINES"
              HAS_TAURI=true
            fi
          done < <(find apps/desktop/src-tauri/src -name '*.rs' -not -path '*/commands/*' -not -name 'lib.rs' -not -name 'main.rs')
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test-api:
    name: Test API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm --filter @tuari/api test:coverage

  test-web:
    name: Test Web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm test:web

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-api, test-web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"
