name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Test (API)
        run: pnpm test:api

      - name: Coverage (API)
        run: pnpm --filter @tuari/api test:coverage

      - name: Test (Web)
        run: pnpm test:web

      - name: Build
        run: pnpm build
