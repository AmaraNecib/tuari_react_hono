name: CI

on:
  pull_request:
  workflow_dispatch:

# Auto-cancel older CI runs on the same PR — only the latest commit runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter queries the PR diff via the API

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint
      # Root-level gates turbo never runs: turbo has no root lint task, so the
      # prose gate and the issue-closing harness would silently pass CI.
      - run: pnpm check:unslop
      - run: pnpm test:prose
      - run: pnpm test:ci-scripts
      - run: pnpm check:e2e-selection
      - run: pnpm check:license-signer

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo typecheck --filter="!@tuari/desktop"

  # ── Path-gated jobs ─────────────────────────────────────────────
  # Each job ALWAYS runs (so its required status check always reports)
  # but its expensive steps are skipped when no relevant file changed.
  # Change detection uses dorny/paths-filter (compares base..head) —
  # NOT hashFiles, which hashes files that EXIST (always non-empty).

  # Shared change-detection job: computes which areas this PR touches.
  detect:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.resolve.outputs.rust }}
      api: ${{ steps.resolve.outputs.api }}
      web: ${{ steps.resolve.outputs.web }}
      e2e: ${{ steps.resolve.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'
              # The Node signer defines the wire format the Rust verifier
              # enforces, so a signer-only change must re-run the Rust suite
              # (tests/license_signer_interop.rs mints with it).
              - 'scripts/generate-license.mjs'
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'infrastructure/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            e2e:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'tests/e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'

      # Manual dispatch (workflow_dispatch) has no PR diff to compare —
      # paths-filter would see "no changes" and skip every test, defeating
      # the escape hatch. Force all areas to run on manual dispatch.
      - name: Resolve areas (manual dispatch = run everything)
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "e2e=${{ steps.filter.outputs.e2e }}" >> "$GITHUB_OUTPUT"
          fi

  test-rust:
    name: "Test Rust Core (no tauri:: imports)"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri system deps
        if: needs.detect.outputs.rust == 'true'
        run: |
          if pkg-config --exists webkit2gtk-4.1; then
            echo "webkit2gtk-4.1 already present"
          else
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          fi

      - name: Install Rust toolchain
        if: needs.detect.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        if: needs.detect.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Install Node.js (signer interop test)
        # tests/license_signer_interop.rs shells out to
        # scripts/generate-license.mjs, so the Rust job needs Node in PATH.
        if: needs.detect.outputs.rust == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Verify tool versions"
        if: needs.detect.outputs.rust == 'true'
        run: |
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "Rust: $(rustc --version)"

      - name: "Verify Rust Core boundaries (no bare tauri imports)"
        if: needs.detect.outputs.rust == 'true'
        run: |
          echo "Checking for forbidden 'tauri::' imports in Rust Core modules..."
          HAS_TAURI=false
          while IFS= read -r mod; do
            LINES=$(grep -nE 'use tauri|tauri::' "$mod" || true)
            if [ -n "$LINES" ]; then
              echo "ERROR: forbidden tauri import in $mod"
              echo "$LINES"
              HAS_TAURI=true
            fi
          done < <(find apps/desktop/src-tauri/src -name '*.rs' -not -path '*/commands/*' -not -name 'lib.rs' -not -name 'main.rs')
          if [ "$HAS_TAURI" = true ]; then
            echo "FAILED: Rust Core modules must not import tauri::"
            exit 1
          fi
          echo "PASSED: No forbidden imports found"

      - name: Test Rust Core
        # The license/trust core gates what a customer can run, so this step
        # runs the whole crate: lib unit tests, the integration suites
        # (including the Node-signer→Rust-verifier interop test), and doctests.
        if: needs.detect.outputs.rust == 'true'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Rust skipped (no src-tauri changes)
        if: needs.detect.outputs.rust != 'true'
        run: echo "No Rust changes — skipping cargo test (required check satisfied)"

  test-api:
    name: Test API
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test API
        if: needs.detect.outputs.api == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm --filter @tuari/api test:coverage

      - name: API skipped (no api/contracts changes)
        if: needs.detect.outputs.api != 'true'
        run: echo "No API changes — skipping tests (required check satisfied)"

  test-web:
    name: Test Web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Test Web
        if: needs.detect.outputs.web == 'true'
        run: |
          pnpm --filter @tuari/contracts build
          pnpm test:web

      - name: Web skipped (no web/contracts changes)
        if: needs.detect.outputs.web != 'true'
        run: echo "No Web changes — skipping tests (required check satisfied)"

  test-e2e:
    name: Test E2E
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The e2e scope selector diffs the PR head against the base branch,
          # which needs the merge base — a shallow checkout cannot compute it.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright browser cache (issue #333): Chromium (~120MB) was
      # re-downloaded on every E2E run (~40s). Key on the exact Playwright
      # version so an upgrade busts the cache automatically. On a hit the
      # `playwright install chromium` step below skips the
      # download; on a miss it installs and the post-step saves the cache.
      - name: Resolve Playwright version (cache key)
        id: pw-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        # Pinned to a full commit SHA (v4 tag = 0057852bfaa89a56745cba8c7296529d2fc39830)
        # — mutable tags can be retargeted upstream and poison the browser
        # cache consumed by later test steps (repo security precedent: checkout
        # is SHA-pinned in auto-close-issues.yml).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Select E2E scope (PR diff, fails closed)
        id: e2e-scope
        if: needs.detect.outputs.e2e == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "mode=full"
              echo "specs="
              echo "reason=manual dispatch — run everything"
            } >> "$GITHUB_OUTPUT"
          else
            # Fail closed: if the base ref cannot be fetched the changed-file
            # list is empty and the selector returns mode=full (whole suite).
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/e2e-changed.txt || true
            node scripts/ci/e2e-selection.mjs --mode e2e --files /tmp/e2e-changed.txt >> "$GITHUB_OUTPUT"
          fi

      - name: Test E2E
        if: needs.detect.outputs.e2e == 'true' && steps.e2e-scope.outputs.mode != 'skip'
        env:
          # Passed through the environment, not interpolated into the script:
          # map-derived, but never splice shipped data into shell source.
          E2E_SPECS: ${{ steps.e2e-scope.outputs.specs }}
        run: |
          pnpm exec playwright install --with-deps chromium
          # shellcheck disable=SC2086  # E2E_SPECS is an intentional space-separated list
          pnpm test:e2e $E2E_SPECS

      - name: Upload Playwright HTML report
        if: needs.detect.outputs.e2e == 'true' && steps.e2e-scope.outputs.mode != 'skip' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (immutable SHA, matching the cache action pinning practice)
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: E2E skipped (no browser-reachable path changed)
        if: needs.detect.outputs.e2e == 'true' && steps.e2e-scope.outputs.mode == 'skip'
        run: echo "No browser-reachable changes — scoped e2e skipped (required check satisfied)"

      - name: E2E skipped (no api/web/contracts/e2e changes)
        if: needs.detect.outputs.e2e != 'true'
        run: echo "No E2E-relevant changes — skipping (required check satisfied)"

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Runs CONCURRENTLY with the test jobs (issue #333): previously this waited
    # on all five test jobs, so every PR paid test-time PLUS build-time
    # sequentially (~1.5 min of pure tail latency). Branch protection still
    # requires `Build`, so the merge gate is unchanged — the PR just stops
    # waiting twice. Cost: a red-test PR also spends ~50s on a cached build;
    # accepted for the latency win (no new runner minutes, only overlap).
    needs: detect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tuari/contracts build
      - run: pnpm turbo build --filter="!@tuari/desktop"
